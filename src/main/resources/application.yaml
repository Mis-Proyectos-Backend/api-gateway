server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/accounts/**

            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/customers/**

            - id: movement-service
              uri: lb://movement-service
              predicates:
                    - Path=/movements/**

            - id: credit-service
              uri: lb://credit-service
              predicates:
                - Path=/credits/**

            - id: debit-card-service
              uri: lb://debit-card-service
              predicates:
                - Path=/debit-cards/**

            - id: yanki-service
              uri: lb://yanki-service
              predicates:
                - Path=/api/yanki/**

            - id: movement-service
              uri: lb://movement-service
              predicates:
                - Path=/reports/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    hostname: localhost

app:
  security:
    user:
      username: admin
      password: admin123

jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
  expiration: 3600000